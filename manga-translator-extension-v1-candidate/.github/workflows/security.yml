name: supply-chain-policy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 22
      - name: Verify immutable workflow references and Phase 8 Store policy
        run: node scripts/verify-phase7-contracts.mjs && node scripts/verify-phase8-contracts.mjs
