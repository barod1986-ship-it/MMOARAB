name: assemble-controlled-release
run-name: assemble-controlled-release / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
      release_id:
        description: Immutable release archive id, for example v0.9.0-rc1
        required: true
        type: string
      release_class:
        description: Controlled release class
        required: true
        default: developer-preview
        type: choice
        options: [developer-preview, private-v1, public-v1]
      extension_run_id:
        description: Successful release-extension-candidate workflow run id
        required: true
        type: string
      linux_engine_run_id:
        description: Successful Linux Engine candidate workflow run id
        required: true
        type: string
      windows_engine_run_id:
        description: Optional Windows Engine candidate workflow run id
        required: false
        type: string
      macos_engine_run_id:
        description: Optional macOS Engine candidate workflow run id
        required: false
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  assemble-exact-tested-artifacts:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_class == 'public-v1' && 'controlled-public-release' || 'release-candidate' }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - name: Verify extension toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "12.0.2"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.5
      - name: Locked source verification
        run: |
          python scripts/verify_source_integrity.py
          test -f package-lock.json
          npm ci
          test -f engine/uv.lock
          (cd engine && uv lock --check)
          npm run check:remote-transfer-consent
          npm run check:phase9-contracts
          npm run check:controlled-release-tools
          npm run check:release-evidence-tools
          npm run check:v1-orchestration-tools
          npm run check:release-ready-gate-tools
      - name: Verify candidate run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          verify_run() {
            local run_id="$1" expected_workflow="$2"
            test -n "$run_id" || return 0
            local head conclusion path
            head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)"
            path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .path)"
            test "$head" = "$GITHUB_SHA"
            test "$conclusion" = "success"
            case "$path" in *"$expected_workflow"*) ;; *) echo "unexpected candidate workflow: $path" >&2; exit 2;; esac
          }
          verify_run '${{ inputs.extension_run_id }}' 'release-extension.yml'
          verify_run '${{ inputs.linux_engine_run_id }}' 'release-engine-linux.yml'
          verify_run '${{ inputs.windows_engine_run_id }}' 'release-engine-windows.yml'
          verify_run '${{ inputs.macos_engine_run_id }}' 'release-engine-macos.yml'
      - name: Download exact tested extension candidate
        uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.extension_run_id }}
          name: extension-candidate
          path: release-inputs/extension
      - name: Download Linux Engine candidate
        uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_engine_run_id }}
          name: engine-linux-x86_64-candidate
          path: release-inputs/linux
      - name: Download Windows Engine candidate
        if: ${{ inputs.windows_engine_run_id != '' }}
        uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_engine_run_id }}
          name: engine-windows-x86_64-candidate
          path: release-inputs/windows
      - name: Download macOS Engine candidate
        if: ${{ inputs.macos_engine_run_id != '' }}
        uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.macos_engine_run_id }}
          name: engine-macos-arm64-candidate
          path: release-inputs/macos
      - name: Assemble immutable controlled archive
        shell: bash
        run: |
          set -euo pipefail
          EXT="$(find release-inputs/extension -type f -name '*.zip' -print -quit)"
          test -n "$EXT"
          EXT_SHA="$(sha256sum "$EXT" | awk '{print $1}')"
          QUALIFIED_SHA="$GITHUB_SHA"
          if [[ '${{ inputs.release_class }}' != 'developer-preview' ]]; then
            QUALIFIED_SHA="$(python -c "import json; from pathlib import Path; v=json.loads(Path('engine/mte_engine/benchmark/production-profile-freeze.json').read_text(encoding='utf-8')); print((v.get('qualifiedSource') or {}).get('sourceHeadSha',''))")"
            [[ "$QUALIFIED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          fi
          ARGS=(--release-id '${{ inputs.release_id }}' --release-class '${{ inputs.release_class }}' --source-head-sha "$GITHUB_SHA" --qualified-source-head-sha "$QUALIFIED_SHA" --extension-zip "$EXT" --extension-sha256 "$EXT_SHA")
          if [[ '${{ inputs.release_class }}' != 'developer-preview' ]]; then
            for SPEC in \
              "release-inputs/extension|extension.cyclonedx.json" \
              "release-inputs/linux|engine.cyclonedx-1.5.json" \
              "release-inputs/linux|engine.pylock.toml" \
              "release-inputs/linux|MODEL_LICENSES.json" \
              ".|production-profile-freeze.json"; do
              IFS='|' read -r SEARCH_DIR META_NAME <<< "$SPEC"
              if [[ "$META_NAME" == "production-profile-freeze.json" ]]; then
                META="engine/mte_engine/benchmark/production-profile-freeze.json"
              else
                META="$(find "$SEARCH_DIR" -type f -name "$META_NAME" -print -quit)"
              fi
              test -n "$META"
              META_SHA="$(sha256sum "$META" | awk '{print $1}')"
              ARGS+=(--metadata "$META::$META_SHA")
            done
          fi
          for DIR in linux windows macos; do
            test -d "release-inputs/$DIR" || continue
            SELECTED="$(python scripts/select_engine_candidate.py "release-inputs/$DIR" --release-class '${{ inputs.release_class }}')"
            IFS=$'\t' read -r ART META SHA <<< "$SELECTED"
            ARGS+=(--engine "$ART::$META::$SHA")
          done
          python scripts/prepare_controlled_release.py "${ARGS[@]}"
      - name: Seal V1 orchestration controlled-assembly checkpoint
        if: ${{ inputs.release_class != 'developer-preview' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/orchestration
          python scripts/v1_evidence_orchestrator.py init \
            --release-id '${{ inputs.release_id }}' \
            --release-class '${{ inputs.release_class }}' \
            --assembly-source-head-sha "$GITHUB_SHA" \
            --output release/orchestration/qualification-promoted.json
          python scripts/v1_evidence_orchestrator.py controlled \
            --session release/orchestration/qualification-promoted.json \
            --controlled-manifest "release/controlled/${{ inputs.release_id }}/controlled-release.json" \
            --controlled-run-id "$GITHUB_RUN_ID" \
            --extension-run-id '${{ inputs.extension_run_id }}' \
            --linux-run-id '${{ inputs.linux_engine_run_id }}' \
            --macos-run-id '${{ inputs.macos_engine_run_id }}' \
            --windows-run-id '${{ inputs.windows_engine_run_id }}' \
            --output release/orchestration/controlled-assembled.json
          python scripts/v1_evidence_orchestrator.py verify --session release/orchestration/controlled-assembled.json
      - name: Upload V1 orchestration checkpoint
        if: ${{ inputs.release_class != 'developer-preview' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: v1-orchestration-${{ inputs.release_id }}-controlled
          path: release/orchestration/controlled-assembled.json
          if-no-files-found: error
      - name: Attest immutable controlled archive
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616 # v4
        with:
          subject-path: release/controlled/${{ inputs.release_id }}/*
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: controlled-release-${{ inputs.release_id }}
          path: release/controlled/${{ inputs.release_id }}/*
          if-no-files-found: error
