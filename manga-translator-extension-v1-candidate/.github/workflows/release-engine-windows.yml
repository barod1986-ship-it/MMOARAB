name: release-engine-windows-candidate
run-name: release-engine-windows-candidate / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
      public_release:
        description: Require audited public support claim and signing credentials
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    runs-on: windows-latest
    environment: ${{ inputs.public_release && 'release-windows' || 'release-candidate' }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - run: python -m pip install uv==0.12.5
      - name: Public release support gate
        if: ${{ inputs.public_release }}
        run: python engine/packaging/verify_support_claim.py windows-x86_64 --require-public
      - name: Sync locked packaging environment
        shell: pwsh
        run: |
          if (-not (Test-Path engine/uv.lock)) { throw 'engine/uv.lock missing' }
          Set-Location engine
          uv sync --locked --extra test --extra packaging --extra production-ocr
      - name: Build and smoke native candidate
        shell: pwsh
        run: |
          Set-Location engine
          uv run python packaging/build_engine.py --release
          uv run python packaging/smoke_engine.py .packaging-dist/mte-engine/mte-engine.exe
      - name: Validate Artifact Signing configuration
        if: ${{ inputs.public_release }}
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.MTE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.MTE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          PROFILE: ${{ vars.MTE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($Name in @('ENDPOINT','ACCOUNT','PROFILE','AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID')) {
            if (-not (Get-Item "env:$Name").Value) { throw "Missing protected Artifact Signing setting: $Name" }
          }
          if (-not $env:ENDPOINT.StartsWith('https://')) { throw 'Artifact Signing endpoint must be HTTPS.' }
      - name: Azure login for Artifact Signing OIDC
        if: ${{ inputs.public_release }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign public Windows payload with Microsoft Artifact Signing
        if: ${{ inputs.public_release }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.MTE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.MTE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.MTE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\engine\.packaging-dist\mte-engine
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify and package exact signed Windows payload
        if: ${{ inputs.public_release }}
        shell: pwsh
        run: engine/packaging/windows/verify-package-signed.ps1 -RootPath engine/.packaging-dist/mte-engine -OutputZip release/candidates/mte-local-engine-0.5.0-windows-x86_64-signed.zip
      - name: Finalize signed artifact compatibility metadata
        if: ${{ inputs.public_release }}
        shell: pwsh
        run: python engine/packaging/finalize_compatibility.py release/candidates/mte-local-engine-0.5.0-windows-x86_64-signed.zip --target windows-x86_64 --signed
      - name: Release metadata
        shell: pwsh
        run: Set-Location engine; uv run python scripts/release_metadata.py
      - name: Attest candidate
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616 # v4
        with:
          subject-path: release/candidates/*
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: engine-windows-x86_64-candidate
          path: |
            release/candidates/*
            release/metadata/*
          if-no-files-found: error
