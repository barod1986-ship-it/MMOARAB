name: prepare-chrome-web-store-candidate
run-name: prepare-chrome-web-store-candidate / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
      release_id:
        description: Public V1 controlled release id
        required: true
        type: string
      controlled_release_run_id:
        description: Successful assemble-controlled-release run containing the exact public-v1 archive
        required: true
        type: string
      require_listing_assets:
        description: Also require all real Store listing assets before uploading the candidate artifact
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  promote-exact-controlled-extension:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.5
      - name: Verify source and pre-Store orchestration state
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "12.0.2"
          test -f package-lock.json
          npm ci
          test -f engine/uv.lock
          (cd engine && uv lock --check)
          python scripts/verify_source_integrity.py
          npm run check:store-tools
          npm run check:phase9-contracts
          npm run check:v1-orchestration-tools
          python - <<'PY'
          from pathlib import Path
          from scripts.v1_evidence_orchestrator import read_session
          s=read_session(Path('release-control/v1-orchestration.json'), 'evidence-promoted')
          assert s['releaseClass']=='public-v1', 'Store candidate requires public-v1 evidence-promoted orchestration'
          PY
      - name: Verify controlled-release workflow provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.controlled_release_run_id }}
        run: |
          set -euo pipefail
          expected_head="$(python - <<'PY'
          from pathlib import Path
          from scripts.v1_evidence_orchestrator import read_session
          print(read_session(Path('release-control/v1-orchestration.json'), 'evidence-promoted')['assemblySourceHeadSha'])
          PY
          )"
          head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)"
          path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .path)"
          test "$head" = "$expected_head"
          test "$conclusion" = "success"
          case "$path" in *"controlled-release.yml"*) ;; *) echo "unexpected workflow: $path" >&2; exit 2;; esac
      - name: Download exact controlled public V1 archive
        uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.controlled_release_run_id }}
          name: controlled-release-${{ inputs.release_id }}
          path: release/controlled/${{ inputs.release_id }}
      - name: Seal pre-Store handoff and promote exact Extension bytes
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="release/controlled/${{ inputs.release_id }}/controlled-release.json"
          python scripts/v1_evidence_orchestrator.py store-handoff \
            --session release-control/v1-orchestration.json \
            --controlled-manifest "$MANIFEST" \
            --output release/store/store-submission-handoff.json
          EXT="$(python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('release/controlled/${{ inputs.release_id }}/controlled-release.json').read_text())
          print(Path('release/controlled/${{ inputs.release_id }}') / m['extension']['artifact'])
          PY
          )"
          EXT_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('release/controlled/${{ inputs.release_id }}/controlled-release.json').read_text())
          print(str(m['extension']['sha256']).removeprefix('sha256:'))
          PY
          )"
          python scripts/prepare_store_candidate.py \
            --zip "$EXT" \
            --tested-sha256 "$EXT_SHA" \
            --controlled-manifest "$MANIFEST" \
            --store-submission-handoff release/store/store-submission-handoff.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('release/store/candidate.json').read_text())
          assert c['schemaVersion']==2 and c['byteIdenticalToControlledExtension'] is True
          assert c['sha256']==c['testedSha256']
          PY
      - name: Validate optional listing assets
        if: ${{ inputs.require_listing_assets }}
        run: node scripts/verify-store-assets.mjs store/publication-state.json
      - name: Attest exact Store submission candidate
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616 # v4
        with:
          subject-path: release/store/*
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: chrome-web-store-candidate-${{ inputs.release_id }}
          path: release/store/*
          if-no-files-found: error
      - name: Upload optional Store listing packet
        if: ${{ inputs.require_listing_assets }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: chrome-web-store-listing-${{ inputs.release_id }}
          path: |
            store/listing/*
            store/privacy/*
            store/permissions.md
            store/review-notes.md
          if-no-files-found: error
