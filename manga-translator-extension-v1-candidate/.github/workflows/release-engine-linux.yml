name: release-engine-linux-candidate
run-name: release-engine-linux-candidate / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
      public_release:
        description: Require audited public support claim
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    environment: release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - run: python -m pip install uv==0.12.5
      - name: Public release support gate
        if: ${{ inputs.public_release }}
        run: python engine/packaging/verify_support_claim.py linux-x86_64 --require-public
      - name: Sync locked packaging environment
        run: |
          test -f engine/uv.lock
          cd engine
          uv sync --locked --extra test --extra packaging --extra production-ocr
      - name: Build and smoke native candidate
        run: |
          cd engine
          uv run python packaging/build_engine.py --release
          uv run python packaging/smoke_engine.py .packaging-dist/mte-engine/mte-engine
      - name: Release metadata
        run: cd engine && uv run python scripts/release_metadata.py
      - name: Attest candidate
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616 # v4
        with:
          subject-path: release/candidates/*
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: engine-linux-x86_64-candidate
          path: |
            release/candidates/*
            release/metadata/*
          if-no-files-found: error
