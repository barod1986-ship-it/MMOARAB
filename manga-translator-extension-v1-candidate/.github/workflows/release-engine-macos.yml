name: release-engine-macos-candidate
run-name: release-engine-macos-candidate / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
      public_release:
        description: Require audited public support claim and Apple signing/notarization
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    runs-on: macos-15
    environment: ${{ inputs.public_release && 'release-macos' || 'release-candidate' }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - run: python -m pip install uv==0.12.5
      - name: Public release support gate
        if: ${{ inputs.public_release }}
        run: python engine/packaging/verify_support_claim.py macos-arm64 --require-public
      - name: Sync locked packaging environment
        run: |
          test -f engine/uv.lock
          cd engine
          uv sync --locked --extra test --extra packaging --extra production-ocr
      - name: Build and smoke native candidate
        run: |
          cd engine
          uv run python packaging/build_engine.py --release
          uv run python packaging/smoke_engine.py .packaging-dist/mte-engine/mte-engine
      - name: Materialize ephemeral Developer ID and notarization credentials, then sign/notarize
        if: ${{ inputs.public_release }}
        env:
          MTE_DEVELOPER_ID_APPLICATION: ${{ secrets.MTE_DEVELOPER_ID_APPLICATION }}
          MTE_DEVELOPER_ID_INSTALLER: ${{ secrets.MTE_DEVELOPER_ID_INSTALLER }}
          MTE_MACOS_APPLICATION_P12_BASE64: ${{ secrets.MTE_MACOS_APPLICATION_P12_BASE64 }}
          MTE_MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.MTE_MACOS_APPLICATION_P12_PASSWORD }}
          MTE_MACOS_INSTALLER_P12_BASE64: ${{ secrets.MTE_MACOS_INSTALLER_P12_BASE64 }}
          MTE_MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MTE_MACOS_INSTALLER_P12_PASSWORD }}
          MTE_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MTE_MACOS_KEYCHAIN_PASSWORD }}
          MTE_NOTARY_KEY_ID: ${{ secrets.MTE_NOTARY_KEY_ID }}
          MTE_NOTARY_ISSUER_ID: ${{ secrets.MTE_NOTARY_ISSUER_ID }}
          MTE_NOTARY_KEY_P8_BASE64: ${{ secrets.MTE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in MTE_DEVELOPER_ID_APPLICATION MTE_DEVELOPER_ID_INSTALLER MTE_MACOS_APPLICATION_P12_BASE64 MTE_MACOS_APPLICATION_P12_PASSWORD MTE_MACOS_INSTALLER_P12_BASE64 MTE_MACOS_INSTALLER_P12_PASSWORD MTE_MACOS_KEYCHAIN_PASSWORD MTE_NOTARY_KEY_ID MTE_NOTARY_ISSUER_ID MTE_NOTARY_KEY_P8_BASE64; do
            test -n "${!name:-}" || { echo "missing protected signing input: $name" >&2; exit 2; }
          done
          KEYCHAIN="$RUNNER_TEMP/mte-release-signing.keychain-db"
          APP_P12="$RUNNER_TEMP/mte-developer-id-application.p12"
          INSTALLER_P12="$RUNNER_TEMP/mte-developer-id-installer.p12"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${MTE_NOTARY_KEY_ID}.p8"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$APP_P12" "$INSTALLER_P12" "$NOTARY_KEY"
          }
          trap cleanup EXIT
          export APP_P12 INSTALLER_P12 NOTARY_KEY
          python - <<'PY'
          import base64, os
          from pathlib import Path
          pairs = [
              ('MTE_MACOS_APPLICATION_P12_BASE64', os.environ['APP_P12']),
              ('MTE_MACOS_INSTALLER_P12_BASE64', os.environ['INSTALLER_P12']),
              ('MTE_NOTARY_KEY_P8_BASE64', os.environ['NOTARY_KEY']),
          ]
          for name, path in pairs:
              Path(path).write_bytes(base64.b64decode(os.environ[name], validate=True))
          PY
          chmod 600 "$APP_P12" "$INSTALLER_P12" "$NOTARY_KEY"
          security create-keychain -p "$MTE_MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MTE_MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APP_P12" -k "$KEYCHAIN" -P "$MTE_MACOS_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security import "$INSTALLER_P12" -k "$KEYCHAIN" -P "$MTE_MACOS_INSTALLER_P12_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MTE_MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$MTE_DEVELOPER_ID_APPLICATION" >/dev/null
          security find-certificate -c "$MTE_DEVELOPER_ID_INSTALLER" "$KEYCHAIN" >/dev/null
          MTE_NOTARY_KEY_PATH="$NOTARY_KEY" \
            engine/packaging/macos/sign-notarize.sh engine/.packaging-dist/mte-engine release/candidates/mte-local-engine-0.5.0-macos-arm64.pkg
      - name: Finalize notarized artifact compatibility metadata
        if: ${{ inputs.public_release }}
        run: python engine/packaging/finalize_compatibility.py release/candidates/mte-local-engine-0.5.0-macos-arm64.pkg --target macos-arm64 --signed --notarized
      - name: Release metadata
        run: cd engine && uv run python scripts/release_metadata.py
      - name: Attest candidate
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616 # v4
        with:
          subject-path: release/candidates/*
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: engine-macos-arm64-candidate
          path: |
            release/candidates/*
            release/metadata/*
          if-no-files-found: error
