name: promote-production-qualification-evidence
run-name: promote-production-qualification-evidence / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
      qualification_execute_run_id:
        description: Passing execute-mode qualify-production-ml-self-hosted workflow run id
        required: true
        type: string
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: promote-production-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  promote-as-reviewed-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    runs-on: ubuntu-latest
    environment: production-qualification-promotion
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Verify qualification execute run provenance
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.qualification_execute_run_id }}
        run: |
          set -euo pipefail
          test "$RUN_ID" != ""
          HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)"
          CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)"
          PATH_NAME="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .path)"
          EVENT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .event)"
          test "$HEAD" = "$GITHUB_SHA"
          test "$CONCLUSION" = "success"
          test "$EVENT" = "workflow_dispatch"
          case "$PATH_NAME" in *"qualify-production-ml-self-hosted.yml"*) ;; *) echo "unexpected qualification workflow: $PATH_NAME" >&2; exit 2;; esac
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.qualification_execute_run_id }}
          name: qualification-release-evidence-${{ inputs.qualification_execute_run_id }}
          path: .qualification-release-evidence
      - name: Promote only evidence bound to this exact qualified source commit
        run: |
          set -euo pipefail
          python scripts/promote_qualification_release_evidence.py \
            --root . --evidence-dir .qualification-release-evidence \
            --expected-source-sha '${{ steps.provenance.outputs.head }}'
          python scripts/verify_source_integrity.py
          npm run check:phase5b-contracts
          npm run check:phase9-contracts
          npm run check:release-ready-gate-tools
      - name: Ensure promotion changes only the reviewed evidence allowlist
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED='^(package-lock\.json|engine/uv\.lock|engine/mte_engine/benchmark/production-profile-freeze\.json|release-control/release-state\.json|SOURCE_SHA256SUMS\.txt)$'
          CHANGED="$(git status --short | awk '{print $2}')"
          test -n "$CHANGED"
          while IFS= read -r path; do
            [[ "$path" =~ $ALLOWED ]] || { echo "unexpected promotion change: $path" >&2; exit 2; }
          done <<< "$CHANGED"
      - name: Open reviewed evidence-promotion pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.qualification_execute_run_id }}
        run: |
          set -euo pipefail
          BRANCH="qualification-evidence/run-${RUN_ID}-${{ inputs.run_intent_nonce }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add package-lock.json engine/uv.lock engine/mte_engine/benchmark/production-profile-freeze.json release-control/release-state.json SOURCE_SHA256SUMS.txt
          git commit -m "Promote qualified V1 release evidence from run ${RUN_ID}"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
            --title "Promote qualified V1 release evidence (${RUN_ID}, intent=${{ inputs.run_intent_nonce }})" \
            --body "Promotes only the dependency locks, source-bound production freeze, release-state mirrors, and source checksums exported by passing qualification execute run ${RUN_ID}. Runtime source changes are forbidden by the promotion allowlist and freeze source binding."
