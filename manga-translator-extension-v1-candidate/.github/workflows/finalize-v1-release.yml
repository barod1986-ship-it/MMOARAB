name: finalize-v1-release
run-name: finalize-v1-release / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
      release_id:
        description: Controlled V1 release id
        required: true
        type: string
      release_class:
        description: V1 release class to finalize
        required: true
        type: choice
        options: [private-v1, public-v1]
      controlled_release_run_id:
        description: Successful controlled-release workflow run id
        required: true
        type: string
      store_candidate_run_id:
        description: Required for public-v1; exact Store candidate workflow run id
        required: false
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  final-evidence-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_class == 'public-v1' && 'controlled-public-release' || 'release-candidate' }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.5
      - name: Verify workflow inputs and source evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "12.0.2"
          test -f package-lock.json
          npm ci
          test -f engine/uv.lock
          (cd engine && uv lock --check)
          python scripts/verify_source_integrity.py
          npm run check:phase9-contracts
          npm run check:v1-orchestration-tools
          npm run check:public-release-evidence-tools
          npm run check:release-ready-gate-tools
          python - <<'PY'
          from pathlib import Path
          from scripts.v1_evidence_orchestrator import read_session
          s=read_session(Path('release-control/v1-orchestration.json'))
          expected='public-evidence-promoted' if '${{ inputs.release_class }}'=='public-v1' else 'evidence-promoted'
          assert s['stage']==expected, (s['stage'], expected)
          assert s['releaseClass']=='${{ inputs.release_class }}'
          assert s['releaseId']=='${{ inputs.release_id }}'
          PY
          if [[ '${{ inputs.release_class }}' == 'public-v1' ]]; then
            test -n '${{ inputs.store_candidate_run_id }}'
          fi
      - name: Verify controlled workflow provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.controlled_release_run_id }}
        run: |
          set -euo pipefail
          expected_head="$(python - <<'PY'
          from pathlib import Path
          from scripts.v1_evidence_orchestrator import read_session
          print(read_session(Path('release-control/v1-orchestration.json'))['assemblySourceHeadSha'])
          PY
          )"
          head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)"
          path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .path)"
          test "$head" = "$expected_head"
          test "$conclusion" = "success"
          case "$path" in *"controlled-release.yml"*) ;; *) echo "unexpected controlled workflow: $path" >&2; exit 2;; esac
      - name: Download exact controlled archive
        uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.controlled_release_run_id }}
          name: controlled-release-${{ inputs.release_id }}
          path: release/controlled/${{ inputs.release_id }}
      - name: Verify public Store candidate workflow provenance
        if: ${{ inputs.release_class == 'public-v1' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_RUN_ID: ${{ inputs.store_candidate_run_id }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STORE_RUN_ID}" --jq .conclusion)"
          path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STORE_RUN_ID}" --jq .path)"
          test "$conclusion" = "success"
          case "$path" in *"prepare-store-candidate.yml"*) ;; *) echo "unexpected Store candidate workflow: $path" >&2; exit 2;; esac
      - name: Download exact public Store candidate handoff
        if: ${{ inputs.release_class == 'public-v1' }}
        uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.store_candidate_run_id }}
          name: chrome-web-store-candidate-${{ inputs.release_id }}
          path: release/store-download
      - name: Stage public Store candidate evidence for final gate
        if: ${{ inputs.release_class == 'public-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/store
          cp release/store-download/candidate.json release/store/candidate.json
          cp release/store-download/store-submission-handoff.json release/store/store-submission-handoff.json
          CANDIDATE="$(python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('release/store/candidate.json').read_text())
          print(c['artifact'])
          PY
          )"
          cp "release/store-download/$CANDIDATE" "release/store/$CANDIDATE"
      - name: Run final controlled V1 gate and seal release-ready checkpoint
        run: |
          set -euo pipefail
          python scripts/v1_evidence_orchestrator.py finalize \
            --session release-control/v1-orchestration.json \
            --output release/orchestration/release-ready.json
          python scripts/v1_evidence_orchestrator.py verify --session release/orchestration/release-ready.json
      - name: Build and verify exact final release capsule
        shell: bash
        run: |
          set -euo pipefail
          python scripts/final_release_capsule.py build \
            --session release/orchestration/release-ready.json \
            --controlled-dir "release/controlled/${{ inputs.release_id }}" \
            --output "release/final/${{ inputs.release_id }}" \
            --finalization-source-head-sha "$GITHUB_SHA"
          python scripts/final_release_capsule.py verify \
            --capsule "release/final/${{ inputs.release_id }}"
      - name: Attest every exact final capsule subject
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616 # v4
        with:
          subject-checksums: release/final/${{ inputs.release_id }}/CAPSULE_SHA256SUMS.txt
      - name: Attest final capsule checksum index
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616 # v4
        with:
          subject-path: release/final/${{ inputs.release_id }}/CAPSULE_SHA256SUMS.txt
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: v1-final-release-${{ inputs.release_id }}
          path: release/final/${{ inputs.release_id }}/**
          if-no-files-found: error
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: v1-release-ready-${{ inputs.release_id }}
          path: release/orchestration/release-ready.json
          if-no-files-found: error
