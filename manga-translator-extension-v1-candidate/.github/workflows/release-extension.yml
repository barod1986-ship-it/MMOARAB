name: release-extension-candidate
run-name: release-extension-candidate / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    environment: release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - name: Verify extension toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "12.0.2"
      - name: Locked extension build
        run: |
          test -f package-lock.json
          npm ci
          npm run check
          npm run check:phase8-contracts
          npm run zip
      - name: Locate extension zip
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find .output -type f -name '*.zip' -print -quit)"
          test -n "$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
      - name: Extension SBOM and checksums
        run: node scripts/release-extension-metadata.mjs "${{ steps.artifact.outputs.path }}"
      - name: Attest extension artifact
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: extension-candidate
          path: |
            ${{ steps.artifact.outputs.path }}
            release/extension-metadata/*
          if-no-files-found: error
