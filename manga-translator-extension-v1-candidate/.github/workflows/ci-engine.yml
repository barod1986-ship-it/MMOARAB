name: ci-engine
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        run: python -m pip install uv==0.12.5
      - name: Require and verify Engine lock
        run: |
          test -f engine/uv.lock
          cd engine
          uv lock --check
      - name: Sync exact test environment
        run: cd engine && uv sync --locked --extra test --extra production-ocr
      - name: Production OCR runtime imports
        run: cd engine && uv run python -c "import paddle, paddleocr, manga_ocr; print(paddle.__version__, paddleocr.__version__)"
      - name: Engine tests
        run: cd engine && uv run pytest -q
      - name: Benchmark and packaging contracts
        run: |
          cd engine
          uv run python scripts/verify_phase5b_contracts.py
          uv run python scripts/verify_model_catalog.py model-catalog/model-candidates-v1.json
