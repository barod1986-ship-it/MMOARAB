name: bootstrap-dependency-locks
run-name: bootstrap-dependency-locks / intent=${{ inputs.run_intent_nonce }} / ${{ github.sha }} / ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
permissions:
  contents: read
jobs:
  generate-and-verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    environment: production-qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - name: Verify JavaScript lock toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "12.0.2"
      - name: Generate npm lock from registry resolution
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3 || !p.packages || Object.keys(p.packages).length<2) process.exit(2)"
      - name: Verify npm lock with clean install and project checks
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm run check:toolchain
          npm run check:structural
          npm test
          npm run build
          npm run check:manifest
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.5
      - name: Verify Python lock toolchain
        run: |
          set -euo pipefail
          test "$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.15"
          test "$(uv --version | awk '{print $2}')" = "0.12.5"
      - name: Generate and verify universal Engine lock
        run: |
          set -euo pipefail
          rm -f engine/uv.lock
          cd engine
          uv lock
          uv lock --check
          test "$(grep -c '^\[\[package\]\]' uv.lock)" -gt 1
          uv sync --locked --extra test --extra packaging --extra production-ocr
          uv run python -c "import paddle, paddleocr, manga_ocr; print(paddle.__version__, paddleocr.__version__)"
          uv run pytest -q
          uv run python scripts/verify_phase5b_contracts.py
          uv run python scripts/verify_model_catalog.py model-catalog/model-candidates-v1.json
      - name: Bind new locks into source integrity
        run: |
          set -euo pipefail
          python scripts/update_source_sha256s.py
          python scripts/verify_source_integrity.py
      - name: Produce lock bootstrap evidence
        run: |
          set -euo pipefail
          mkdir -p release/lock-bootstrap
          cp package-lock.json release/lock-bootstrap/package-lock.json
          cp engine/uv.lock release/lock-bootstrap/uv.lock
          cp SOURCE_SHA256SUMS.txt release/lock-bootstrap/SOURCE_SHA256SUMS.txt
          node - <<'NODE'
          const fs=require('fs'); const crypto=require('crypto');
          const sha=(p)=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const out={schemaVersion:1,node:'24.19.0',npm:'12.0.2',python:'3.13.15',uv:'0.12.5',files:{
            'package-lock.json':sha('package-lock.json'),
            'engine/uv.lock':sha('engine/uv.lock'),
            'SOURCE_SHA256SUMS.txt':sha('SOURCE_SHA256SUMS.txt')
          }};
          fs.writeFileSync('release/lock-bootstrap/dependency-lock-report.json', JSON.stringify(out,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: dependency-locks
          path: release/lock-bootstrap/*
          if-no-files-found: error
