name: qualify-production-ml-self-hosted
run-name: Production qualification / ${{ inputs.mode }} / ${{ github.sha }} / ${{ github.actor }} / intent=${{ inputs.run_intent_nonce }}
on:
  workflow_dispatch:
    inputs:
      run_intent_nonce:
        description: Controller-generated immutable launch intent nonce
        required: true
        type: string
      mode:
        description: Prepare stable qualification workspace, or execute an already prepared workspace
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - execute
      input_bundle_relative:
        description: Prepare only - sealed REV13 qualification input bundle relative to MTE_QUALIFICATION_INPUT_ROOT
        required: false
        type: string
      corpus_relative:
        description: Execute only - same sealed corpus manifest path used by the prepared workspace
        required: false
        type: string
      workspace_relative:
        description: Prepared qualification workspace path relative to the qualification root
        required: true
        type: string
      benchmark_review_relative:
        description: Execute only - sealed benchmark review bound to the prepared runPlanSha256
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-ml-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  input-preflight:
    if: ${{ (inputs.mode == 'prepare') && (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id)) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    environment: production-qualification
    runs-on: [self-hosted, linux, x64, mte-production-qualification]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Materialize the qualification readiness toolchain only
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          python -m pip install --disable-pip-version-check 'uv==0.12.5' 'pillow==12.3.0'
      - name: Verify protected qualification runner contract
        env:
          MTE_QUALIFICATION_INPUT_ROOT: ${{ vars.MTE_QUALIFICATION_INPUT_ROOT }}
        run: python scripts/probe_production_execution_environment.py --role qualification-linux-x86_64 --strict
      - name: Require a semantically valid sealed operator bundle and reachable primary endpoints
        env:
          QUAL_ROOT: ${{ vars.MTE_QUALIFICATION_INPUT_ROOT }}
          INPUT_BUNDLE_REL: ${{ inputs.input_bundle_relative }}
        run: |
          set -euo pipefail
          test -n "$QUAL_ROOT" || { echo 'MTE_QUALIFICATION_INPUT_ROOT is required.' >&2; exit 1; }
          test -n "$INPUT_BUNDLE_REL" || { echo 'input_bundle_relative is required in prepare mode.' >&2; exit 1; }
          python engine/scripts/probe_real_qualification_readiness.py \
            --repo-root . --input-root "$QUAL_ROOT" --input-bundle "$INPUT_BUNDLE_REL" \
            --output "$RUNNER_TEMP/mte-qualification-readiness.json" --strict

  bootstrap-locks:
    if: ${{ (inputs.mode == 'prepare') && (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id)) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    needs: input-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: '24.19.0'
      - name: Generate real npm lock on a network runner
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "12.0.2"
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3 || !p.packages || Object.keys(p.packages).length<2) process.exit(2)"
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm run check:toolchain
          npm run check:structural
          npm test
          npm run build
          npm run check:manifest
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Generate real universal Engine lock on a network runner
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.12.5'
          test "$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.15"
          test "$(uv --version | awk '{print $2}')" = "0.12.5"
          rm -f engine/uv.lock
          cd engine
          uv lock
          uv lock --check
          test "$(grep -c '^\[\[package\]\]' uv.lock)" -gt 1
          uv sync --locked --extra test --extra packaging --extra production
          uv run python -c "import onnxruntime, paddle, paddleocr, manga_ocr; print(onnxruntime.__version__, paddle.__version__, paddleocr.__version__)"
          uv run pytest -q
          uv run python scripts/verify_phase5b_contracts.py
          uv run python scripts/verify_model_catalog.py model-catalog/model-candidates-v1.json
      - name: Bind generated locks into exact source integrity
        run: |
          set -euo pipefail
          python scripts/update_source_sha256s.py
          python scripts/verify_source_integrity.py
          mkdir -p release/qualification-lock-bootstrap
          cp package-lock.json release/qualification-lock-bootstrap/package-lock.json
          cp engine/uv.lock release/qualification-lock-bootstrap/uv.lock
          cp SOURCE_SHA256SUMS.txt release/qualification-lock-bootstrap/SOURCE_SHA256SUMS.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open('rb') as f:
                  while chunk:=f.read(1024*1024): h.update(chunk)
              return 'sha256:'+h.hexdigest()
          out={
            'schemaVersion':1,
            'revision':'rev11-real-qualification-lock-bootstrap-v1',
            'toolchain':{'node':'24.19.0','npm':'12.0.2','python':'3.13.15','uv':'0.12.5'},
            'sourceHeadSha':'${{ github.sha }}',
            'files':{
              'package-lock.json':sha('package-lock.json'),
              'engine/uv.lock':sha('engine/uv.lock'),
              'SOURCE_SHA256SUMS.txt':sha('SOURCE_SHA256SUMS.txt'),
            },
          }
          Path('release/qualification-lock-bootstrap/dependency-lock-report.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: qualification-dependency-locks-${{ github.run_id }}
          path: release/qualification-lock-bootstrap/*
          if-no-files-found: error
          retention-days: 7

  prepare:
    if: ${{ (inputs.mode == 'prepare') && (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id)) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    needs: bootstrap-locks
    environment: production-qualification
    runs-on: [self-hosted, linux, x64, mte-production-qualification]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: qualification-dependency-locks-${{ github.run_id }}
          path: .qualification-lock-bootstrap
      - name: Restore the just-generated lock bytes into this exact checkout
        run: |
          set -euo pipefail
          cp .qualification-lock-bootstrap/package-lock.json package-lock.json
          cp .qualification-lock-bootstrap/uv.lock engine/uv.lock
          cp .qualification-lock-bootstrap/SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.txt
          python scripts/verify_source_integrity.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Materialize the exact locked Engine graph
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.12.5'
          cd engine
          uv lock --check
          uv sync --frozen --extra production --extra test
      - name: Verify the single sealed prepare input bundle
        env:
          QUAL_ROOT: ${{ vars.MTE_QUALIFICATION_INPUT_ROOT }}
          INPUT_BUNDLE_REL: ${{ inputs.input_bundle_relative }}
          WORKSPACE_REL: ${{ inputs.workspace_relative }}
        run: |
          set -euo pipefail
          test -n "$QUAL_ROOT" || { echo 'MTE_QUALIFICATION_INPUT_ROOT is required.' >&2; exit 1; }
          test -n "$INPUT_BUNDLE_REL" || { echo 'input_bundle_relative is required in prepare mode.' >&2; exit 1; }
          python engine/scripts/verify_qualification_input_bundle.py \
            --root "$QUAL_ROOT" --bundle "$INPUT_BUNDLE_REL" \
            --workspace "$WORKSPACE_REL" --github-env "$GITHUB_ENV"
      - name: Verify acquisition and manual derivation policies before downloads
        run: |
          set -euo pipefail
          python engine/scripts/verify_acquisition_sources.py
          python engine/scripts/verify_manual_artifact_policy.py
      - name: Acquire all seven automated artifacts from the already verified bundle and prepare one stable run plan
        run: |
          set -euo pipefail
          cd engine
          uv run --frozen python scripts/run_production_qualification.py \
            --workspace "$MTE_Q_WORKSPACE" --corpus "$MTE_Q_CORPUS" \
            --artifact-reviews-dir "$MTE_Q_REVIEWS" --manual-artifacts-dir "$MTE_Q_MANUAL" \
            --input-bundle-sha256 "$MTE_Q_INPUT_BUNDLE_SHA256" \
            --download-automated --replace
      - name: Seal the exact lock bytes and source commit beside the prepared workspace
        run: |
          set -euo pipefail
          cd engine
          uv run --frozen python scripts/manage_qualification_lock_bundle.py seal \
            --repo-root .. --workspace "$MTE_Q_WORKSPACE" --source-sha '${{ github.sha }}' \
            --lock-report ../.qualification-lock-bootstrap/dependency-lock-report.json --replace
      - name: Publish only safe preparation evidence
        run: |
          set -euo pipefail
          mkdir -p release/qualification-prepare-evidence
          cp "$MTE_Q_WORKSPACE/benchmark-run-plan.json" release/qualification-prepare-evidence/
          cp "$MTE_Q_WORKSPACE/qualification-summary.json" release/qualification-prepare-evidence/
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: qualification-run-plan-${{ github.run_id }}
          path: release/qualification-prepare-evidence/*
          if-no-files-found: error
          retention-days: 14
      - name: Summarize locally retained prepared evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['MTE_Q_WORKSPACE'])
          plan=json.loads((root/'benchmark-run-plan.json').read_text(encoding='utf-8'))
          summary=json.loads((root/'qualification-summary.json').read_text(encoding='utf-8'))
          lines=[
            '## Production ML qualification prepared', '',
            f'- Stable runPlanSha256: `{plan["runPlanSha256"]}`',
            f'- Sealed input bundle: `{os.environ.get("MTE_Q_INPUT_BUNDLE_SHA256", "missing")}`',
            f'- Automated primary-source artifacts acquired/intaken: `{summary["automatedArtifactCount"]}`',
            f'- Reviewed manual-derived artifacts intaken: `{summary["manualArtifactCount"]}`',
            f'- Workspace retained only on self-hosted runner: `{root}`', '',
            'Fill the human benchmark review against this exact runPlanSha256, seal it, then dispatch this workflow in execute mode.',
            'No model, corpus-page, OCR-text trace, or manual checkpoint bytes are uploaded as workflow artifacts.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as h: h.write('\n'.join(lines)+'\n')
          PY

  execute:
    if: ${{ (inputs.mode == 'execute') && (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON(vars.MTE_PRODUCTION_OPERATOR_ID_ALLOWLIST_JSON), github.actor_id)) && startsWith(inputs.run_intent_nonce, 'mte-') }}
    environment: production-qualification
    runs-on: [self-hosted, linux, x64, mte-production-qualification]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.1.0
      - name: Resolve execute-only operator inputs
        env:
          QUAL_ROOT: ${{ vars.MTE_QUALIFICATION_INPUT_ROOT }}
          CORPUS_REL: ${{ inputs.corpus_relative }}
          WORKSPACE_REL: ${{ inputs.workspace_relative }}
          REVIEW_REL: ${{ inputs.benchmark_review_relative }}
        run: |
          set -euo pipefail
          test -n "$QUAL_ROOT" || { echo 'MTE_QUALIFICATION_INPUT_ROOT is required.' >&2; exit 1; }
          test -n "$CORPUS_REL" || { echo 'corpus_relative is required in execute mode.' >&2; exit 1; }
          test -n "$REVIEW_REL" || { echo 'benchmark_review_relative is required in execute mode.' >&2; exit 1; }
          python engine/scripts/resolve_qualification_inputs.py \
            --phase execute --root "$QUAL_ROOT" --corpus "$CORPUS_REL" \
            --workspace "$WORKSPACE_REL" --benchmark-review "$REVIEW_REL" --github-env "$GITHUB_ENV"
      - name: Restore the exact locks sealed by the prepare phase
        run: |
          set -euo pipefail
          python engine/scripts/manage_qualification_lock_bundle.py restore \
            --repo-root . --workspace "$MTE_Q_WORKSPACE" --expected-source-sha '${{ github.sha }}'
          python scripts/verify_source_integrity.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13.15'
      - name: Materialize the exact prepared Engine graph
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.12.5'
          cd engine
          uv lock --check
          uv sync --frozen --extra production --extra test
      - name: Execute the real corpus benchmark from the immutable prepared workspace
        run: |
          set -euo pipefail
          cd engine
          uv run --frozen python scripts/execute_prepared_qualification.py \
            --workspace "$MTE_Q_WORKSPACE" --corpus "$MTE_Q_CORPUS" \
            --benchmark-review "$MTE_Q_BENCHMARK_REVIEW" --replace-results
      - name: Export release-safe qualification evidence for reviewed promotion
        run: |
          set -euo pipefail
          test -s "$MTE_Q_WORKSPACE/production-profile-freeze.json"
          python engine/scripts/export_qualification_release_evidence.py \
            --repo-root . --workspace "$MTE_Q_WORKSPACE" \
            --output-dir release/qualification-release-evidence --replace
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: qualification-release-evidence-${{ github.run_id }}
          path: release/qualification-release-evidence/*
          if-no-files-found: error
          retention-days: 30
      - name: Summarize valid freeze
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['MTE_Q_WORKSPACE'])
          result=json.loads((root/'qualification-execution-summary.json').read_text(encoding='utf-8'))
          freeze=json.loads((root/'production-profile-freeze.json').read_text(encoding='utf-8'))
          lines=[
            '## Production ML qualification passed', '',
            f'- runPlanSha256: `{result["runPlanSha256"]}`',
            f'- Gate passed: `{result["gatePassed"]}`',
            f'- production-profile-freeze.json SHA-256: `{result["freezeFileSha256"]}`',
            f'- Freeze content digest: `{freeze["freezeSha256"]}`', '',
            'Raw benchmark traces, corpus pages, model bytes, and checkpoints remain only in the protected self-hosted workspace. The uploaded release-evidence artifact contains only dependency locks, the validated freeze, and safe control summaries for reviewed promotion.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as h: h.write('\n'.join(lines)+'\n')
          PY
