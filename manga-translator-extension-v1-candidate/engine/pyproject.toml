[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mte-local-engine"
version = "0.5.0"
description = "Loopback-only staged manga translation engine with auditable production benchmark gates."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.3",
  "pillow==12.3.0",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<0.29", "pytest>=8.4,<9", "pytest-asyncio>=0.25,<2"]
packaging = ["pyinstaller==6.22.2"]
production-ocr = ["paddlepaddle==3.3.1", "paddleocr==3.7.0", "manga-ocr==0.1.16"]
production-inpaint = ["onnxruntime==1.29.0"]
production = ["paddlepaddle==3.3.1", "paddleocr==3.7.0", "manga-ocr==0.1.16", "onnxruntime==1.29.0"]

[project.scripts]
mte-engine = "mte_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mte_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"mte_engine.benchmark" = ["production-profile-freeze.json"]
"mte_engine.resources" = ["*.json"]
