name: Stage 262 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: stage-262-hugel-bingo-review

      - name: Apply review and generate reports
        run: python3 tools/apply_stage_262.py

      - name: Correct package comparison metadata
        run: python3 tools/fix_stage262_reports.py

      - name: Upload generated deliverables
        uses: actions/upload-artifact@v4
        with:
          name: stage-262-deliverables
          path: |
            rathena-master/npc/other/hugel_bingo.txt
            تقارير_المراجعة_الحوارية/00_الملفات_المتبقية.csv
            تقارير_المراجعة_الحوارية/00_الملفات_المكتملة.csv
            تقارير_المراجعة_الحوارية/00_متابعة_المراجعة_الحوارية.csv
            تقارير_المراجعة_الحوارية/00_متابعة_المراجعة_الحوارية.md
            تقارير_المراجعة_الحوارية/المرحلة_262
            تقارير_المراجعة_الحوارية/ملف_تتبع_المراجعة_الحوارية_حتى_المرحلة_262.xlsx
          if-no-files-found: error

      - name: Commit validated deliverables
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'stage-262-hugel-bingo-review';
            const workflowPath = '.github/workflows/stage262.yml';
            const output = cp.execFileSync('git', ['status', '--porcelain=v1', '-z'], { encoding: 'utf8' });
            const records = output.split('\0').filter(Boolean);
            const entries = [];
            for (const record of records) {
              const status = record.slice(0, 2);
              const filePath = record.slice(3);
              if (filePath === workflowPath) continue;
              if (status.includes('D')) {
                entries.push({ path: filePath, mode: '100644', type: 'blob', sha: null });
                continue;
              }
              const data = fs.readFileSync(filePath);
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content: data.toString('base64'),
                encoding: 'base64'
              });
              entries.push({ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            if (!entries.length) {
              core.setFailed('No generated changes found.');
              return;
            }
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const parentSha = ref.data.object.sha;
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha });
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parent.data.tree.sha,
              tree: entries
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'Stage 262 hugel bingo',
              tree: tree.data.sha,
              parents: [parentSha]
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false
            });
            core.notice(`Committed ${entries.length} stage files as ${commit.data.sha}`);
