name: Extract stage 262 text pairs

on:
  push:
    branches:
      - stage-262-hugel-bingo

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/extract_stage262.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage-262-text-pairs
          path: stage262_pairs
          retention-days: 7
