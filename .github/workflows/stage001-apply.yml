name: Apply stage 001 Izlude review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/stage001-apply.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed corrections
        run: python tools/apply_stage001_izlude_review.py

      - name: Validate repository
        run: |
          python tools/validate_repository.py
          python tools/validate_terminology_policy.py
          python tools/validate_translation_content.py --base origin/main

      - name: Commit reviewed files
        run: |
          rm -f stage001-validation.txt
          git config user.name "MMOARAB Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rathena-master/npc/cities/izlude.txt glossary/master_glossary.csv stage001-validation.txt
          git commit -m "review: refine Izlude dialogue and glossary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
