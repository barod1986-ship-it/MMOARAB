name: Apply stage 001 Izlude review

on:
  push:
    branches:
      - review-cycle-2/stage-001-prontera-izlude
    paths:
      - .github/workflows/stage001-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed corrections
        run: python tools/apply_stage001_izlude_review.py

      - name: Validate repository
        run: |
          python tools/validate_repository.py
          python tools/validate_terminology_policy.py
          python tools/validate_translation_content.py --base origin/main

      - name: Commit reviewed files
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "MMOARAB Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rathena-master/npc/cities/izlude.txt glossary/master_glossary.csv
          git commit -m "review: refine Izlude dialogue and glossary"
          git push
