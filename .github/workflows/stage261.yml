name: Build stage 261 package

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  stage261:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble and validate stage tool
        shell: bash
        run: |
          cat tools/stage261_part_*.txt > tools/apply_stage_261.py
          python -m py_compile tools/apply_stage_261.py

      - name: Apply stage 261
        run: python tools/apply_stage_261.py

      - name: Remove temporary automation files
        shell: bash
        run: |
          rm -f tools/stage261_part_*.txt
          rm -f tools/apply_stage_261.py
          rm -rf tools/__pycache__
          rm -f .github/workflows/stage261.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit reviewed package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "المرحلة 261: مراجعة gympass وتحديث التتبع"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: stage-261-complete-package
          path: .
          include-hidden-files: false
          retention-days: 7
